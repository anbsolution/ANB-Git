name: ANB Git Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_BASE64: ${{ secrets.ANB_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANB_KEYSTORE_BASE64" || { echo "Missing ANB_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/anb-signing"
          echo "$ANB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anb-signing/anb-git-release.jks"
          test -s "$RUNNER_TEMP/anb-signing/anb-git-release.jks"

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_PASSWORD: ${{ secrets.ANB_KEYSTORE_PASSWORD }}
          ANB_KEY_ALIAS: ${{ secrets.ANB_KEY_ALIAS }}
          ANB_KEY_PASSWORD: ${{ secrets.ANB_KEY_PASSWORD }}
        run: |
          test -n "$ANB_KEYSTORE_PASSWORD" || { echo "Missing ANB_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANB_KEY_ALIAS" || { echo "Missing ANB_KEY_ALIAS"; exit 1; }
          test -n "$ANB_KEY_PASSWORD" || { echo "Missing ANB_KEY_PASSWORD"; exit 1; }

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_PATH: ${{ runner.temp }}/anb-signing/anb-git-release.jks
          ANB_KEYSTORE_PASSWORD: ${{ secrets.ANB_KEYSTORE_PASSWORD }}
          ANB_KEY_ALIAS: ${{ secrets.ANB_KEY_ALIAS }}
          ANB_KEY_PASSWORD: ${{ secrets.ANB_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anb-git-release-v1.0.0-phase4-update1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
