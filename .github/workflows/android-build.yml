name: ANB Git Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^" ]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building ANB Git $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_BASE64: ${{ secrets.ANB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANB_KEYSTORE_BASE64" || { echo "Missing ANB_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/anb-signing"
          printf "%s" "$ANB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anb-signing/anb-git-release.jks"
          test -s "$RUNNER_TEMP/anb-signing/anb-git-release.jks"

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_PASSWORD: ${{ secrets.ANB_KEYSTORE_PASSWORD }}
          ANB_KEY_ALIAS: ${{ secrets.ANB_KEY_ALIAS }}
          ANB_KEY_PASSWORD: ${{ secrets.ANB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANB_KEYSTORE_PASSWORD" || { echo "Missing ANB_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANB_KEY_ALIAS" || { echo "Missing ANB_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANB_KEY_PASSWORD" || { echo "Missing ANB_KEY_PASSWORD repository secret"; exit 1; }

      - name: Verify restored keystore and private key
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_PASSWORD: ${{ secrets.ANB_KEYSTORE_PASSWORD }}
          ANB_KEY_ALIAS: ${{ secrets.ANB_KEY_ALIAS }}
          ANB_KEY_PASSWORD: ${{ secrets.ANB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/anb-signing/anb-git-release.jks"
          sha256sum "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANB_KEYSTORE_PASSWORD" -alias "$ANB_KEY_ALIAS" > /dev/null
          mkdir -p "$RUNNER_TEMP/anb-preflight"
          printf 'ANB Git signing preflight\n' > "$RUNNER_TEMP/anb-preflight/test.txt"
          jar cf "$RUNNER_TEMP/anb-preflight/test.jar" -C "$RUNNER_TEMP/anb-preflight" test.txt
          jarsigner -keystore "$KEYSTORE" -storepass "$ANB_KEYSTORE_PASSWORD" -keypass "$ANB_KEY_PASSWORD" \
            "$RUNNER_TEMP/anb-preflight/test.jar" "$ANB_KEY_ALIAS" > /dev/null
          jarsigner -verify "$RUNNER_TEMP/anb-preflight/test.jar" > /dev/null
          echo "Keystore and private-key signing preflight passed."

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANB_KEYSTORE_PATH: ${{ runner.temp }}/anb-signing/anb-git-release.jks
          ANB_KEYSTORE_PASSWORD: ${{ secrets.ANB_KEYSTORE_PASSWORD }}
          ANB_KEY_ALIAS: ${{ secrets.ANB_KEY_ALIAS }}
          ANB_KEY_PASSWORD: ${{ secrets.ANB_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare release payload and checksum
        if: github.event_name != 'pull_request'
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release-payload
          cp app/build/outputs/apk/release/app-release.apk release-payload/app-release.apk
          test -s release-payload/app-release.apk
          SHA256=$(sha256sum release-payload/app-release.apk | cut -d ' ' -f 1)
          {
            echo "Official signed ANB Git Android release."
            echo
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "sha256=$SHA256"
            echo
            echo "Install updates from Settings → App Updates inside ANB Git."
          } > release-payload/release-notes.txt
          echo "APK SHA-256: $SHA256"

      - name: Upload release payload for publisher job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-payload-v${{ steps.app_version.outputs.version_name }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 2

  publish-release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload-v${{ needs.build.outputs.version_name }}
          path: release-payload

      - name: Publish official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: ANB Git v${{ needs.build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-payload/release-notes.txt
          files: release-payload/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
